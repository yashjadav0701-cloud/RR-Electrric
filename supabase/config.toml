
[functions.validate-coupon]
enabled = true
verify_jwt = false
import_map = "./functions/validate-coupon/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/validate-coupon/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/validate-coupon/*.html" ]

[functions.proactive-engagement]
enabled = true
verify_jwt = false
import_map = "./functions/proactive-engagement/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/proactive-engagement/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/proactive-engagement/*.html" ]




[functions.create-order]
enabled = true
# Customer checkout is public. The function validates products and pricing
# server-side using the service role key, so the gateway must not require a JWT.
verify_jwt = false

[functions.prepare-invoice]
enabled = true
# The function validates the bearer token and admin role itself.
# Disable gateway JWT verification so unauthenticated browser OPTIONS
# preflight requests can reach the function CORS handler.
verify_jwt = false
import_map = "./functions/prepare-invoice/deno.json"
entrypoint = "./functions/prepare-invoice/index.ts"
